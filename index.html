<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قرعة عشوائية: اختر اسمًا أو رقمًا بالحظ | أداة مجانية</title>
<meta name="description" content="قرعة عادلة بعشوائية حقيقية: الصق قائمة أسماء واختر فائزًا أو أكثر بدون تكرار، أو ولّد رقمًا عشوائيًا في أي نطاق. دون إرسال أي بيانات.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:1.6rem 1rem;text-align:center}
header h1{font-size:1.5rem}
.tagline{opacity:.92;font-size:.95rem;margin-top:.25rem}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:1rem}
.card{background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:1rem}
.card h2{font-size:1.1rem;margin-bottom:.4rem;color:#0f766e}
label{display:block;font-weight:700;margin:.75rem 0 .3rem}
input,select,textarea{width:100%;padding:.7rem .8rem;border:1.5px solid #cbd5e1;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:#1e293b}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(20,184,166,.18)}
.row{display:flex;gap:.6rem}
.row>*{flex:1;min-width:0}
button{display:inline-block;width:100%;padding:.8rem;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:1rem}
button:hover{background:#115e59}
button.ghost{background:#e2e8f0;color:#1e293b}
.result{background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:10px;padding:1rem;margin-top:1rem;font-size:1.05rem;word-break:break-word}
.result b{color:#047857}
.result.warn{background:#fffbeb;border-color:#fcd34d}
.result.warn b{color:#b45309}
.result.bad{background:#fef2f2;border-color:#fca5a5}
.result.bad b{color:#b91c1c}
.muted{color:#64748b;font-size:.85rem}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:1.2rem 1rem;font-size:.85rem;line-height:1.9}
footer a{color:#5eead4}
table{width:100%;border-collapse:collapse;margin-top:.5rem}
th,td{padding:.5rem;border-bottom:1px solid #e2e8f0;text-align:right;font-size:.95rem}
.big{font-size:1.6rem;font-weight:800}
.hidden{display:none}
.chk{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.chk input{width:auto}

</style>
</head>
<body>
<header>
<h1>قرعة عشوائية</h1>
<p class="tagline">مين يكسب؟ الصق الأسماء وخلي الحظ يقرر — بعشوائية حقيقية</p>
</header>
<main>
<div class="card">
<h2>قرعة الأسماء</h2>
<label for="names">الأسماء (اسم في كل سطر)</label>
<textarea id="names" rows="6" placeholder="أحمد&#10;سارة&#10;محمد&#10;منى"></textarea>
<div class="row">
<div>
<label for="count">عدد الفائزين</label>
<input type="number" inputmode="numeric" id="count" min="1" value="1">
</div>
<div style="display:flex;align-items:flex-end">
<button onclick="pick()">اسحب القرعة</button>
</div>
</div>
<div id="out1" class="result hidden"></div>
</div>
<div class="card">
<h2>رقم عشوائي</h2>
<div class="row">
<div>
<label for="min">من</label>
<input type="number" inputmode="numeric" id="min" value="1">
</div>
<div>
<label for="max">إلى</label>
<input type="number" inputmode="numeric" id="max" value="100">
</div>
</div>
<button class="ghost" onclick="roll()">ولّد رقمًا</button>
<div id="out2" class="result hidden"></div>
</div>

</main>
<footer>
<p>تعمل هذه الأداة بالكامل على جهازك، ولا تُحفظ أو تُرسل أي بيانات إلى أي خادم.</p>
<p>أداة مجانية مفتوحة المصدر · بُنيت بمساعدة أدوات ذكاء اصطناعي · <a href="https://github.com/abood-ayman/random-picker-ar">الكود على GitHub</a></p>
</footer>
<script>
window.__jserrors=[];window.addEventListener('error',function(e){window.__jserrors.push(String(e.message))});
const g = id => document.getElementById(id);
const fmt = x => x.toLocaleString('ar-EG');

function randInt(n) {
  if (n <= 0 || !Number.isInteger(n)) return NaN;
  const range = 0x100000000;
  const limit = range - (range % n);
  const buf = new Uint32Array(1);
  let x;
  do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
  return x % n;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function pick() {
  const names = g('names').value.split('\n').map(s => s.trim()).filter(Boolean);
  const k = Math.max(1, Math.floor(parseFloat(g('count').value) || 1));
  const el = g('out1');
  el.classList.remove('hidden');
  if (names.length === 0) { el.innerHTML = '<p>الصق الأسماء أولًا.</p>'; return; }
  if (k > names.length) { el.innerHTML = '<p>عدد الفائزين أكبر من عدد الأسماء (' + fmt(names.length) + ').</p>'; return; }
  const winners = shuffle(names).slice(0, k);
  el.innerHTML = '<p class="big">الفائز' + (k > 1 ? 'ون' : '') + ' من ' + fmt(names.length) + ' اسمًا:</p><ul>' +
    winners.map(w => '<li><b>' + w.replace(/</g, '&lt;') + '</b></li>').join('') + '</ul>';
}

function roll() {
  let min = Math.floor(parseFloat(g('min').value)), max = Math.floor(parseFloat(g('max').value));
  const el = g('out2');
  el.classList.remove('hidden');
  if (isNaN(min) || isNaN(max)) { el.innerHTML = '<p>أدخل نطاقًا صحيحًا.</p>'; return; }
  if (min > max) { const t = min; min = max; max = t; }
  const r = min + randInt(max - min + 1);
  el.innerHTML = '<p class="big">الرقم: <b>' + fmt(r) + '</b></p><p class="muted">في النطاق من ' + fmt(min) + ' إلى ' + fmt(max) + '</p>';
}

window.__test = function () {
  let ok = true;
  for (let i = 0; i < 500; i++) { const x = randInt(6); if (!Number.isInteger(x) || x < 0 || x > 5) ok = false; }
  const s = shuffle([1, 2, 3, 4, 5]);
  ok = ok && s.length === 5 && s.slice().sort().join() === '1,2,3,4,5';
  return { pass: ok, details: { shuffled: s } };
};

window.__demo = function () {
  g('names').value = 'أحمد\nسارة\nمحمد\nمنى\nخالد';
  g('count').value = 2;
  pick();
  g('min').value = 1; g('max').value = 100;
  roll();
};

</script>
</body>
</html>
